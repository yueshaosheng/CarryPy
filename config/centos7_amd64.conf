# 目标平台: CentOS 7.9 (core) x86_64
BASE_IMAGE="centos:7"
DOCKER_PLATFORM="linux/amd64"

# 包管理器家族: debian(apt, 默认) / rhel(yum)
# rhel 路径会自动: 切换 vault.centos.org 归档源 (CentOS 7 已 EOL) +
# 源码编译 OpenSSL 1.1.1 (系统自带 1.0.2 不满足 Python 3.10 要求)
OS_FAMILY="rhel"

# 默认 Python 版本 (完整版本号, 可被 build.sh --python 覆盖)
PYTHON_VERSION="3.10.14"

# 默认预装包 (可被 build.sh --packages 覆盖)
DEFAULT_PACKAGES="numpy matplotlib pandas scipy seaborn plotly pillow scikit-learn"
