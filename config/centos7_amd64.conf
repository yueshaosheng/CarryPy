# 目标平台: CentOS 7.9 (core) x86_64
# 注意: 已 EOL, 构建时自动切换到 vault.centos.org 归档源;
#       系统 OpenSSL 1.0.2 不满足 Python 3.10+ 要求, 会自动源码编译 OpenSSL 1.1.1

# Docker 基础镜像
BASE_IMAGE="centos:7"

# 目标架构
DOCKER_PLATFORM="linux/amd64"

# Python 版本 (主.次版本号, 构建时自动解析为最新 patch 版本, 可被 --python 覆盖)
PYTHON_VERSION="3.11"

# 预装 Python 包 (空格分隔, 可被 build.sh --packages 覆盖)
# 注意: scikit-learn 在 CentOS 7 (glibc 2.17) 上可能无兼容 wheel, 默认不装
# DEFAULT_PACKAGES="numpy matplotlib pandas scipy seaborn plotly pillow scikit-learn"
# DEFAULT_PACKAGES="numpy matplotlib pandas scipy seaborn plotly pillow"
DEFAULT_PACKAGES="numpy matplotlib pandas seaborn openpyxl scipy scikit-learn"
