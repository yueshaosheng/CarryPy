# 目标平台: Rocky Linux 9 (x86_64) — CentOS 9 的社区继承者, 官方维护至 2032
# 说明: 官方源活跃无需切换, 系统自带 OpenSSL 3.0 直接满足 Python 3.11+

# Docker 基础镜像
BASE_IMAGE="rockylinux:9"

# 目标架构
DOCKER_PLATFORM="linux/amd64"

# Python 版本 (主.次版本号, 构建时自动解析为最新 patch 版本, 可被 --python 覆盖)
PYTHON_VERSION="3.11"

# 预装 Python 包 (空格分隔, 可被 build.sh --packages 覆盖)
# DEFAULT_PACKAGES="numpy matplotlib pandas scipy seaborn plotly pillow scikit-learn"
DEFAULT_PACKAGES="numpy matplotlib pandas seaborn openpyxl"
