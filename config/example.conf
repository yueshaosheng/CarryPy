# ========================================================================
# 平台配置参考模板 (复制本文件并修改即可创建新平台配置)
#
# 用法:
#   1. 复制: cp config/example.conf config/my_platform.conf
#   2. 按需修改下面的参数
#   3. 构建: ./build.sh -p my_platform
#
# 文件名即平台名, build.sh 通过 -p <文件名(不含.conf)> 指定
# ========================================================================

# ------------------------------------------------------------------------
# BASE_IMAGE  (必填)
#   Docker 基础镜像, 决定目标机的 glibc 版本和系统库
#   包管理器由镜像内 /etc/os-release 自动判断:
#     ubuntu / debian → apt
#     centos / rocky / almalinux 等 → yum
#
#   Ubuntu 系:
BASE_IMAGE="ubuntu:18.04"           # EOL, 构建时自动切 old-releases 源
# BASE_IMAGE="ubuntu:20.04"         # LTS, 推荐
# BASE_IMAGE="ubuntu:22.04"         # LTS, 较新
# BASE_IMAGE="ubuntu:24.04"         # 最新 LTS
#
#   Debian 系:
# BASE_IMAGE="debian:11"            # bullseye
# BASE_IMAGE="debian:12"            # bookworm
#
#   RHEL 系 (yum):
# BASE_IMAGE="centos:7"             # EOL, 自动切 vault.centos.org + 自编译 OpenSSL 1.1.1
# BASE_IMAGE="rockylinux:8"         # CentOS 8 社区继承者, 维护至 2029
# BASE_IMAGE="rockylinux:9"         # 最新 Rocky
# BASE_IMAGE="almalinux:8"          # CentOS 8 另一继承者
# BASE_IMAGE="almalinux:9"

# ------------------------------------------------------------------------
# DOCKER_PLATFORM  (必填)
#   目标架构, 传给 docker build --platform
#
DOCKER_PLATFORM="linux/amd64"       # x86_64 (最常见)
# DOCKER_PLATFORM="linux/arm64"     # ARM64 (aarch64, 如树莓派 / AWS Graviton)
#
#   注意: 在 Apple Silicon / ARM 宿主机上构建 amd64 会走 QEMU 模拟, 速度较慢
#         Linux 宿主机跨架构需先执行:
#         docker run --privileged --rm tonistiigi/binfmt --install all

# ------------------------------------------------------------------------
# PYTHON_VERSION  (必填)
#   Python 主.次版本号, 构建时自动从 python.org 解析该系列最新 patch 版本
#   也可写完整版本号 (如 3.11.9) 锁定特定 patch
#   可被 build.sh --python 参数覆盖
#
PYTHON_VERSION="3.11"               # → 自动解析为 3.11.x (最新)
# PYTHON_VERSION="3.10"             # → 自动解析为 3.10.x (最新)
# PYTHON_VERSION="3.12"             # → 自动解析为 3.12.x (最新)
# PYTHON_VERSION="3.13"             # → 自动解析为 3.13.x (最新)
# PYTHON_VERSION="3.11.9"           # 锁定完整版本号, 跳过自动解析

# ------------------------------------------------------------------------
# DEFAULT_PACKAGES  (必填, 空格分隔)
#   预装的 Python 包列表, pip install 安装
#   可被 build.sh --packages 参数覆盖
#
#   AI / 数据科学常用:
DEFAULT_PACKAGES="numpy matplotlib pandas scipy seaborn plotly pillow scikit-learn"
#
#   最小化 (仅核心):
# DEFAULT_PACKAGES="numpy pandas"
#
#   带版本约束 (加引号):
# DEFAULT_PACKAGES="numpy==1.26.4 pandas>=2.0 matplotlib"
#
#   包含 Web / 工具类:
# DEFAULT_PACKAGES="numpy pandas requests flask gunicorn"
#
#   空列表 (纯解释器, 不加任何包):
# DEFAULT_PACKAGES=""
