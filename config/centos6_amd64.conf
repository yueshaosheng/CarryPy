# 目标平台: CentOS 6.10 (Final) x86_64
# 注意: 已 EOL, 系统库 (GCC 4.4 / OpenSSL 1.0.1 / sqlite3 3.6) 均过旧;
#       需 SCL devtoolset-9 (GCC 9) + 源码编译 OpenSSL 1.1.1 + sqlite3 3.46;
#       numpy 2.x 要求 GCC >= 9.3, 而 devtoolset-9 仅提供 GCC 9.1.1,
#       因此第三方包需固定到已验证的可编译版本组合 (见 DEFAULT_PACKAGES)

# Docker 基础镜像
BASE_IMAGE="centos:6"

# 目标架构
DOCKER_PLATFORM="linux/amd64"

# Python 版本 (主.次版本号, 自动解析为最新 patch 版本)
# 3.11 已实测可编译运行 (与其他平台对齐); 但 glibc 2.12 上没有预编译 wheel,
# 第三方包全部源码编译且必须固定版本, 推荐用"空包基础 + 增量包"双阶段模式;
# 如需旧版: ./build.sh -p centos6_amd64 --python 3.9 (cp39 可用 wheel 更多, 构建更快)
PYTHON_VERSION="3.11"

# 预装 Python 包 (空格分隔, 可被 build.sh --packages 覆盖)
# 注意: 以下为 py3.11 下实测可编译的固定版本组合 (最新版会因 GCC 9.1 / freetype 2.3 过旧失败);
#       全量包模式缺少预编译的 OpenBLAS/freetype 环境, scipy/sklearn/pillow 会编译失败,
#       请用 ./build.sh --packages "" + ./build_addon.sh 双阶段模式 (addon 流程 7 包已实测全部通过)
DEFAULT_PACKAGES="numpy==1.26.4 matplotlib==3.7.5 pandas==2.2.1 seaborn==0.13.2 openpyxl scipy==1.11.3 scikit-learn==1.3.2"
