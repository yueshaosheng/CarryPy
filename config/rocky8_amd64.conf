# 目标平台: Rocky Linux 8 (x86_64) — CentOS 8 的社区继承者, 二进制兼容, 官方维护至 2029
BASE_IMAGE="rockylinux:8"
DOCKER_PLATFORM="linux/amd64"

# 包管理器由基础镜像自动判断 (ubuntu/debian→apt, 其余→yum);
# Rocky 8 官方源活跃无需切换, 系统自带 OpenSSL 1.1.1 直接满足 Python 3.11

# 默认 Python 版本 (完整版本号, 可被 build.sh --python 覆盖)
PYTHON_VERSION="3.11.9"

# 默认预装包 (可被 build.sh --packages 覆盖)
DEFAULT_PACKAGES="numpy matplotlib pandas scipy seaborn plotly pillow scikit-learn"
