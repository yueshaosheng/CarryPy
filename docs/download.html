<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>获取 CarryPy — 跨平台最小化 Python 环境打包工具</title>
<meta name="description" content="CarryPy 桌面版下载：macOS / Windows / Linux 安装包，自动检测系统架构。">
<style>
  :root {
    --paper: #faf9f7; --card: #ffffff; --ink: #241f3a; --dim: #8b8598;
    --line: #e9e5dc; --accent: #7c5cff; --accent-soft: rgba(124,92,255,.1);
    --btn: #17131f; --btn-text: #ffffff; --row-hover: #f6f4ef;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #14111d; --card: #1c1828; --ink: #ece9f5; --dim: #847d99;
      --line: #2c2840; --accent: #8b7cf7; --accent-soft: rgba(139,124,247,.14);
      --btn: #ece9f5; --btn-text: #17131f; --row-hover: #241f33;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; min-height: 100vh; color: var(--ink);
    font: 14px/1.6 -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', sans-serif;
    background:
      radial-gradient(720px 380px at 12% -6%, rgba(124,92,255,.07), transparent 60%),
      radial-gradient(600px 340px at 96% 108%, rgba(255,212,59,.06), transparent 60%),
      var(--paper);
    padding: 56px 24px 64px;
  }
  .inner { max-width: 920px; margin: 0 auto; }
  .hero { text-align: center; animation: rise .4s ease both; }
  h1 { font-size: 44px; font-weight: 700; margin: 0; letter-spacing: 1px; }
  h1 .brand {
    font-family: Georgia, 'Times New Roman', 'Songti SC', serif; font-style: italic;
    color: var(--accent); margin-left: 10px; font-size: 46px;
  }
  .sub { color: var(--dim); font-size: 14px; margin: 10px 0 0; }
  .meta { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 22px 0 30px; color: var(--dim); font-size: 13px; }
  .version {
    font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 13px;
    padding: 4px 14px; border-radius: 20px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink);
  }
  .main-btn {
    display: inline-flex; align-items: center; gap: 10px; background: var(--btn); color: var(--btn-text);
    border: none; border-radius: 40px; padding: 16px 34px; font-size: 16px; font-weight: 600;
    cursor: pointer; text-decoration: none; box-shadow: 0 12px 32px rgba(23,19,31,.22);
    transition: transform .15s, box-shadow .15s, filter .15s;
  }
  .main-btn:hover { transform: translateY(-2px); box-shadow: 0 16px 40px rgba(23,19,31,.3); filter: brightness(1.08); }
  .main-size { display: block; text-align: center; color: var(--dim); font-size: 12px; margin-top: 10px; }
  .divider { display: flex; align-items: center; gap: 16px; margin: 52px 0 28px; color: var(--accent); font-size: 13px; letter-spacing: 3px; }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--line); }
  .cards { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 20px; }
  @media (max-width: 860px) { .cards { grid-template-columns: 1fr; } h1 { font-size: 34px; } h1 .brand { font-size: 36px; } }
  .card {
    position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 22px 20px 16px; box-shadow: 0 8px 26px rgba(33,29,51,.06);
    animation: rise .45s ease both; transition: transform .16s, box-shadow .16s;
  }
  .card:hover { transform: translateY(-3px); box-shadow: 0 14px 36px rgba(33,29,51,.12); }
  .card.detected { border-top: 3px solid var(--accent); }
  .badge {
    position: absolute; top: 14px; right: 14px; background: var(--accent); color: #fff;
    font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 14px; letter-spacing: 1px;
  }
  .card-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .os-icon {
    width: 42px; height: 42px; border-radius: 11px; display: flex; align-items: center; justify-content: center;
    background: var(--accent-soft); color: var(--accent); flex: none;
  }
  .card-head h3 { margin: 0; font-size: 18px; font-weight: 600; }
  .row { display: flex; align-items: center; gap: 10px; padding: 12px 8px; border-top: 1px solid var(--line); border-radius: 8px; transition: background .13s; }
  .row:hover { background: var(--row-hover); }
  .row-info { flex: 1; min-width: 0; }
  .arch { font-size: 14px; font-weight: 600; }
  .format { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 11.5px; color: var(--dim); margin-top: 2px; }
  .row-btn {
    display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: transparent;
    color: var(--ink); border-radius: 20px; padding: 6px 16px; font-size: 13px; cursor: pointer;
    text-decoration: none; transition: border-color .14s, background .14s, color .14s; flex: none;
  }
  .row-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .row-btn.disabled { opacity: .4; cursor: not-allowed; pointer-events: none; }
  .foot { margin-top: 26px; display: flex; align-items: center; gap: 10px; color: var(--dim); font-size: 12.5px; flex-wrap: wrap; }
  .foot .mono { font-family: ui-monospace, 'SF Mono', Menlo, monospace; background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px; font-size: 12px; }
  .foot a, .foot button { border: none; background: transparent; color: var(--accent); cursor: pointer; font-size: 12.5px; display: inline-flex; align-items: center; gap: 4px; padding: 2px 4px; text-decoration: none; }
  .foot a:hover, .foot button:hover { text-decoration: underline; }
  .note { margin-top: 30px; text-align: center; color: var(--dim); font-size: 11.5px; line-height: 1.8; }
  .note .mono { font-family: ui-monospace, Menlo, monospace; }
  .offline { display: inline-flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 12px; color: var(--dim); }
  .offline button { border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 20px; padding: 3px 12px; font-size: 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
  .offline button:hover { border-color: var(--accent); color: var(--accent); }
  .toast {
    position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%); background: var(--card);
    border: 1px solid var(--accent); border-radius: 9px; padding: 10px 18px; font-size: 13px;
    box-shadow: 0 10px 30px rgba(0,0,0,.2); opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .toast.show { opacity: 1; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="inner">
  <div class="hero">
    <h1>获取<span class="brand">CarryPy</span></h1>
    <p class="sub">跨平台最小化 Python 环境打包工具 · 桌面版</p>
    <div class="meta">
      <span class="version" id="version">v…</span>
      <span id="date-wrap" hidden><span>·</span><span id="date"></span></span>
    </div>
    <a class="main-btn" id="main-btn" hidden>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      <span id="main-label">下载</span>
    </a>
    <span class="main-size" id="main-size"></span>
  </div>

  <div class="divider">所有下载</div>
  <div class="cards" id="cards"></div>

  <div class="foot">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
    也可从 <span class="mono">GitHub Releases</span> 下载历史版本
    <a href="https://github.com/yueshaosheng/CarryPy/releases" target="_blank" rel="noopener">打开 Releases</a>
    <button id="copy-link">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      复制链接
    </button>
  </div>

  <div class="note">
    <span class="offline" id="offline" hidden>离线数据 · 发布后自动更新
      <button id="refresh">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        刷新
      </button>
    </span>
    <br>
    macOS 首次打开若被 Gatekeeper 拦截：右键 → 打开，或执行
    <span class="mono">xattr -dr com.apple.quarantine /Applications/CarryPy.app</span>
    <br>
    运行构建需要打包机安装 Docker；Windows 另需 Git for Windows (Git Bash)。
  </div>
</div>
<div class="toast" id="toast">已复制 Releases 链接</div>

<script>
'use strict';
/* 离线兜底清单：发布新版后回填 (与最新 gui-v* release 同步) */
const BUNDLED = {
  tag: 'gui-v1.0.5', version: '1.0.5', published_at: '2026-11-20T11:26:53Z', source: 'bundled',
  html_url: 'https://github.com/yueshaosheng/CarryPy/releases/tag/gui-v1.0.5',
  assets: [
    { name: 'CarryPy-1.0.5-mac-arm64.dmg', os: 'mac', arch: 'arm64', format: 'dmg', size: 117978893 },
    { name: 'CarryPy-1.0.5-mac-x64.dmg', os: 'mac', arch: 'x64', format: 'dmg', size: 122760742 },
    { name: 'CarryPy-1.0.5-win-x64.exe', os: 'win', arch: 'x64', format: 'exe', size: 105023091 },
    { name: 'CarryPy-1.0.5-linux-x64.deb', os: 'linux', arch: 'x64', format: 'deb', size: 95993080 },
    { name: 'CarryPy-1.0.5-linux-x64.AppImage', os: 'linux', arch: 'x64', format: 'AppImage', size: 123530962 }
  ].map(a => ({ ...a, url: 'https://github.com/yueshaosheng/CarryPy/releases/download/gui-v1.0.5/' + a.name }))
};
const RELEASES_PAGE = 'https://github.com/yueshaosheng/CarryPy/releases';
const ASSET_RE = /^CarryPy-([\d.]+)-(mac|win|linux)-(arm64|x64)\.(dmg|exe|deb|AppImage)$/;
const OS_LABEL = { mac: 'macOS', win: 'Windows', linux: 'Linux' };
const ROWS = {
  mac: [{ arch: 'arm64', format: 'dmg' }, { arch: 'x64', format: 'dmg' }],
  win: [{ arch: 'x64', format: 'exe' }, { arch: 'arm64', format: 'exe' }],
  linux: [{ arch: 'x64', format: 'deb' }, { arch: 'x64', format: 'AppImage' }, { arch: 'arm64', format: 'deb' }]
};
const ICONS = {
  mac: '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M18.7 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.39 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>',
  win: '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3 5.5 10.5 4.4v7.1H3V5.5zm0 13 7.5 1.1v-7.1H3v6zm8.5 1.3L21 21v-8.5h-9.5v7.3zm0-15.6v7.3H21V3l-9.5 1.2z"/></svg>',
  linux: '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c-2.2 0-3.6 1.7-3.6 4v3.2c0 .8-.3 1.6-.8 2.3-1 1.4-2.1 3.2-2.1 5 0 .6.1 1.2.4 1.7-.3.2-.6.5-.6.9 0 .8 1 1.2 2.2 1.5.7.2 1.4.5 1.9.9.6.4 1.5.7 2.6.7s2-.3 2.6-.7c.5-.4 1.2-.7 1.9-.9 1.2-.3 2.2-.7 2.2-1.5 0-.4-.3-.7-.6-.9.3-.5.4-1.1.4-1.7 0-1.8-1.1-3.6-2.1-5-.5-.7-.8-1.5-.8-2.3V6c0-2.3-1.4-4-3.6-4zm-1.4 4.2c.5 0 .9.5.9 1.1s-.4 1.1-.9 1.1-.9-.5-.9-1.1.4-1.1.9-1.1zm2.8 0c.5 0 .9.5.9 1.1s-.4 1.1-.9 1.1-.9-.5-.9-1.1.4-1.1.9-1.1zm-2.5 2.6h2.2l-1.1 1.4-1.1-1.4z"/></svg>',
  dl: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>'
};

function fmtSize(n) {
  if (!n) return '';
  if (n >= 1073741824) return (n / 1073741824).toFixed(2) + ' GB';
  if (n >= 1048576) return (n / 1048576).toFixed(1) + ' MB';
  return Math.round(n / 1024) + ' KB';
}
function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return isNaN(d) ? '' : d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日';
}
function formatLabel(a) {
  return { dmg: '.dmg', exe: '.exe', deb: '.deb — Debian / Ubuntu', AppImage: '.AppImage — 通用 Linux' }[a.format];
}
function archLabel(os, arch) {
  return os === 'mac' ? (arch === 'arm64' ? 'Apple Silicon (arm64)' : 'Intel (x64)') : arch;
}

async function detect() {
  const ua = navigator.userAgent;
  let os = /Macintosh|Mac OS X/.test(ua) ? 'mac' : /Windows/.test(ua) ? 'win' : /Linux|X11/.test(ua) ? 'linux' : null;
  let arch = 'x64';
  try {
    if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
      const h = await navigator.userAgentData.getHighEntropyValues(['architecture']);
      if (h.architecture === 'arm') arch = 'arm64';
      else if (h.architecture === 'x86') arch = 'x64';
      if (navigator.userAgentData.platform === 'macOS') os = 'mac';
      else if (navigator.userAgentData.platform === 'Windows') os = 'win';
      else if (navigator.userAgentData.platform === 'Linux') os = 'linux';
    }
  } catch (e) { /* fall through */ }
  if (os === 'mac' && arch === 'x64' && !navigator.userAgentData) arch = 'arm64'; /* 现代 Mac 多为 Apple Silicon */
  return { os, arch };
}

async function fetchRelease() {
  try {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 8000);
    const res = await fetch('https://api.github.com/repos/yueshaosheng/CarryPy/releases?per_page=30', {
      signal: ctrl.signal, headers: { Accept: 'application/vnd.github+json' }
    });
    clearTimeout(t);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const list = await res.json();
    const cands = list.filter(r => r.tag_name.startsWith('gui-v') && !r.draft);
    const stable = cands.filter(r => !r.prerelease);
    const pick = (stable.length ? stable : cands)[0];
    if (!pick) throw new Error('no gui release');
    const assets = pick.assets.map(a => {
      const m = ASSET_RE.exec(a.name);
      return m ? { name: a.name, url: a.browser_download_url, size: a.size, os: m[2], arch: m[3], format: m[4] } : null;
    }).filter(Boolean);
    for (const b of BUNDLED.assets) {
      if (!assets.some(a => a.os === b.os && a.arch === b.arch && a.format === b.format)) assets.push(b);
    }
    return { tag: pick.tag_name, version: pick.tag_name.replace(/^gui-v/, ''), published_at: pick.published_at, html_url: pick.html_url, assets, source: 'github' };
  } catch (e) {
    return BUNDLED;
  }
}

function findAsset(rel, os, arch, format) {
  const pool = rel.assets.filter(a => a.os === os && a.arch === arch);
  return (format && pool.find(a => a.format === format)) || pool[0] || null;
}

function render(rel, det) {
  document.getElementById('version').textContent = 'v' + rel.version;
  const date = fmtDate(rel.published_at);
  document.getElementById('date-wrap').hidden = !date;
  document.getElementById('date').textContent = date ? '发布于 ' + date : '';
  document.getElementById('offline').hidden = rel.source !== 'bundled';

  const preferred = det.os === 'mac' ? 'dmg' : det.os === 'win' ? 'exe' : 'deb';
  const main = det.os && (findAsset(rel, det.os, det.arch, preferred) || findAsset(rel, det.os, det.arch));
  const btn = document.getElementById('main-btn');
  if (main) {
    btn.hidden = false;
    btn.href = main.url;
    const archPart = det.os === 'mac' ? (main.arch === 'arm64' ? 'Apple Silicon' : 'Intel') : main.arch;
    document.getElementById('main-label').textContent = '下载 ' + OS_LABEL[det.os] + ' 版 (' + archPart + ')';
    document.getElementById('main-size').textContent = main.size ? fmtSize(main.size) + ' · ' + main.name : '';
  }

  const cards = document.getElementById('cards');
  cards.innerHTML = '';
  ['mac', 'win', 'linux'].forEach((os, idx) => {
    const card = document.createElement('div');
    card.className = 'card' + (det.os === os ? ' detected' : '');
    card.style.animationDelay = (idx * 90) + 'ms';
    let html = (det.os === os ? '<span class="badge">已检测</span>' : '') +
      '<div class="card-head"><span class="os-icon">' + ICONS[os] + '</span><h3>' + OS_LABEL[os] + '</h3></div>';
    const seen = new Set();
    let rows = '';
    for (const spec of ROWS[os]) {
      const asset = findAsset(rel, os, spec.arch, spec.format);
      const key = spec.arch + '|' + (asset ? spec.format : '');
      if (!asset && seen.has(spec.arch)) continue;
      seen.add(spec.arch);
      rows += '<div class="row"><div class="row-info"><div class="arch">' + archLabel(os, spec.arch) + '</div>' +
        '<div class="format">' + (asset ? formatLabel(asset) + (asset.size ? ' · ' + fmtSize(asset.size) : '') : '未提供') + '</div></div>' +
        (asset
          ? '<a class="row-btn" href="' + asset.url + '">' + ICONS.dl + '下载</a>'
          : '<span class="row-btn disabled">' + ICONS.dl + '下载</span>') +
        '</div>';
    }
    card.innerHTML = html + (rows || '<div class="row"><div class="row-info"><div class="format">暂无可用安装包</div></div></div>');
    cards.appendChild(card);
  });
}

let current = BUNDLED;
let detection = { os: null, arch: 'x64' };
async function load(force) {
  if (force || current === BUNDLED) current = await fetchRelease();
  render(current, detection);
}
document.getElementById('refresh').addEventListener('click', () => load(true));
document.getElementById('copy-link').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(RELEASES_PAGE); } catch (e) { /* ignore */ }
  const t = document.getElementById('toast');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
});
(async () => {
  detection = await detect();
  render(BUNDLED, detection);   /* 首屏立即渲染兜底数据 */
  await load(false);            /* 再拉取最新 release */
})();
</script>
</body>
</html>
