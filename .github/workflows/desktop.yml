name: Desktop GUI

on:
  push:
    tags:
      - 'gui-v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            cmd: dist:mac:all
          - os: windows-latest
            cmd: dist:win
          - os: ubuntu-latest
            cmd: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: desktop
      - name: Typecheck
        run: npm run typecheck
        working-directory: desktop
      - name: Build installers
        run: npm run ${{ matrix.cmd }}
        working-directory: desktop
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.os }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.exe
            desktop/release/*.deb
            desktop/release/*.AppImage
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
          draft: false