appId: io.github.yueshaosheng.carrypy
productName: CarryPy
directories:
  output: release
  buildResources: resources
files:
  - out/**
asar: true
npmRebuild: false
extraResources:
  - from: ..
    to: project
    filter:
      - build.sh
      - build_addon.sh
      - scripts/**/*
      - config/*.conf
      - '!config/example.conf'
      - docker/Dockerfile
artifactName: CarryPy-${version}-${os}-${arch}.${ext}
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  identity: null
  hardenedRuntime: true
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target:
    - target: deb
      arch:
        - x64
    - target: AppImage
      arch:
        - x64
  category: Development
  maintainer: yueshaosheng
deb:
  artifactName: CarryPy-${version}-linux-x64.deb
appImage:
  artifactName: CarryPy-${version}-linux-x64.AppImage
publish:
  - provider: github
    owner: yueshaosheng
    repo: CarryPy